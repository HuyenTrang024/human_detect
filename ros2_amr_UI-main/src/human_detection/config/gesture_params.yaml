gesture_node:
  ros__parameters:
    # Anh camera truoc tu package camera (sensor_msgs/Image, bgr8)
    image_topic: "/image_front"

    # Duong dan model. De trong -> dung file trong models/ cua package
    yolo_model_path: ""        # models/best.pt                    (YOLO tim nguoi)
    gesture_model_path: ""     # models/ddnet_gesture.pt           (DD-Net, 7 cu chi RoCoG)
    pose_model_path: ""        # models/pose_landmarker_lite.task  (MediaPipe Pose)

    # false = bo YOLO, coi ca khung hinh la nguoi (nhanh hon nhung khac luc train)
    use_yolo: true

    # ByteTrack: gan track_id on dinh cho moi nguoi, publish /people/tracks (cho trajectory_node)
    enable_tracking: true
    tracker_config: ""         # "" -> config/bytetrack_person.yaml

    # Khoa "nguoi chu": chi cu chi cua nguoi da khoa moi dieu khien robot (can enable_tracking: true)
    # Chua khoa: cu chi chay cho ung vien (nguoi gan nhat); ung vien lam lock_gesture thi duoc khoa.
    enable_target_lock: true
    lock_gesture: "FollowMe"
    halt_from_any: true        # Halt cua ung vien chua khoa van co hieu luc (dung nham an toan hon bo lo lenh dung)
    lost_grace_sec: 1.5        # nguoi chu mat: cho noi lai neu ByteTrack doi ID (nen >= lost_sec)
    candidate_dwell_sec: 5.0   # nhieu nguoi chua khoa: cu bay nhieu giay doi ung vien (>= 3.2 s cua so cu chi; 0 = tat)
    miss_tolerance_sec: 0.3    # nguoi chu truot vai frame thi chua coi la mat
    reassoc_dx_ratio: 1.5      # noi lai: lech ngang toi da (tinh theo be rong bbox cu)
    reassoc_size_ratio: 1.6    # noi lai: ti le chieu cao bbox toi da so voi cu

    # "" = tu chon (cuda neu co), "cpu", "cuda"
    device: ""

    # QoS cua subscriber phai khop voi camera: "sensor_data" (Best Effort) hoac "reliable"
    qos_reliability: "sensor_data"

    # Publish anh debug (khung nguoi + xac suat) len /gesture/debug_image
    publish_debug_image: true

    # Bo loc lenh (giong robot_control.py)
    conf_threshold: 0.8    # xac suat toi thieu de chap nhan cu chi; thap hon -> coi la None
    confirm_count: 3       # so lan du doan lien tiep de doi lenh (Halt luon = 1)
    hold_sec: 3.0          # khong thay cu chi moi qua bay nhieu giay -> ve None
    lost_sec: 1.0          # mat nguoi qua bay nhieu giay -> ve None

    # Publish geometry_msgs/Twist dieu khien robot. TAT mac dinh: chi bat khi da test ky.
    enable_cmd_vel: false
    cmd_vel_topic: "/cmd_vel"
